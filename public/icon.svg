<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16303B"/>
      <stop offset="50%" stop-color="#1F4A5A"/>
      <stop offset="100%" stop-color="#0E2129"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE5A4"/>
      <stop offset="35%" stop-color="#D4A24C"/>
      <stop offset="70%" stop-color="#B98534"/>
      <stop offset="100%" stop-color="#936420"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D77F" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#D4A24C" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#B98534" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield / Badge -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" filter="url(#subtleShadow)"/>
  <rect x="28" y="28" width="456" height="456" rx="100" fill="none" stroke="url(#goldBorder)" stroke-width="4"/>

  <!-- Subtle Inner Decorative Accent Line -->
  <rect x="44" y="44" width="424" height="424" rx="84" fill="none" stroke="#D4A24C" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Sculpted Stylized "T" Monogram -->
  <g fill="url(#goldGrad)">
    <!-- Horizontal Crossbar with elegant serif terminals and center crown -->
    <path d="M 124 144
             C 124 136 130 130 138 130
             L 374 130
             C 382 130 388 136 388 144
             L 388 166
             C 388 172 384 176 378 176
             C 364 176 352 168 340 166
             C 314 162 290 168 284 176
             L 284 354
             C 284 366 294 374 310 378
             C 316 380 320 385 320 391
             L 320 396
             C 320 401 315 406 309 406
             L 203 406
             C 197 406 192 401 192 396
             L 192 391
             C 192 385 196 380 202 378
             C 218 374 228 366 228 354
             L 228 176
             C 222 168 198 162 172 166
             C 160 168 148 176 134 176
             C 128 176 124 172 124 166
             Z" />
    <!-- Center Top Star Accent (Empowerment / Spark) -->
    <path d="M 256 78
             L 262 94
             L 278 100
             L 262 106
             L 256 122
             L 250 106
             L 234 100
             L 250 94
             Z" />
  </g>
</svg>
