  <!-- Oxblood Shield Badge -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#oxbloodBg)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#A9803B" stroke-opacity="0.55" stroke-width="3"/>

  <!-- Shared Brass Lens (Vesica Piscis) -->
