      <stop offset="0%" stop-color="#6B2432"/>
      <stop offset="55%" stop-color="#5E1F2B"/>
      <stop offset="100%" stop-color="#45141E"/>
    </linearGradient>
    <linearGradient id="brassLens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C49A4E"/>
      <stop offset="50%" stop-color="#A9803B"/>
      <stop offset="100%" stop-color="#8C672B"/>
